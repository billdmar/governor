<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,monospace">
  <!--
    governor demo — an honest animation stitched from two REAL sources, each
    labeled in the frame:
      * boot -> RUN -> track lines: verbatim from docs/DEMO.md section 1 (QEMU
        Cortex-M3, reproducible via `west build -b qemu_cortex_m3 -t run .`).
      * operator e-stop -> SAFE_STOP: the F13 scenario in
        renode/system_faults.robot writes the exact 9-byte CMD frame to the link
        UART and asserts `GOV state=SAFE_STOP`. The full status line shown
        (faults=0x200 meas/out) is the node's REAL console format (src/main.c)
        with the correct FAULT_OPERATOR_STOP value — a code-faithful rendering of
        that asserted state, not a separately captured transcript.
    Line-reveal timing is illustrative. All timing is QEMU/Renode virtual time
    (logic/structure, not silicon).
  -->
  <defs>
    <style>
      .term  { fill:#0d1117; }
      .bar   { fill:#161b22; }
      .dotr  { fill:#ff5f56; } .doty { fill:#ffbd2e; } .dotg { fill:#27c93f; }
      .ttl   { fill:#8b949e; font-size:12px; }
      text.l { font-size:13.5px; opacity:0; }
      .prompt{ fill:#7c5cff; } .cmd{ fill:#e6edf3; } .dim{ fill:#8b949e; }
      .ok    { fill:#3fb950; } .warn{ fill:#d29922; } .crit{ fill:#f85149; }
      .info  { fill:#58a6ff; }
      /* each line fades in, sequentially; total loop 12s then repeats */
      @keyframes rise { to { opacity:1; } }
      .a1{animation:rise .01s .3s forwards}   .a2{animation:rise .01s 1.0s forwards}
      .a3{animation:rise .01s 1.8s forwards}  .a4{animation:rise .01s 2.3s forwards}
      .a5{animation:rise .01s 2.9s forwards}  .a6{animation:rise .01s 3.5s forwards}
      .a7{animation:rise .01s 4.1s forwards}  .a8{animation:rise .01s 4.7s forwards}
      .a9{animation:rise .01s 5.6s forwards}  .a10{animation:rise .01s 6.6s forwards}
      .a11{animation:rise .01s 7.4s forwards} .a12{animation:rise .01s 8.2s forwards}
      .a13{animation:rise .01s 9.0s forwards} .a14{animation:rise .01s 9.8s forwards}
      /* caret blink */
      .caret{fill:#e6edf3;animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect class="term" x="0" y="0" width="820" height="440" rx="10"/>
  <rect class="bar"  x="0" y="0" width="820" height="30" rx="10"/>
  <rect class="bar"  x="0" y="16" width="820" height="14"/>
  <circle class="dotr" cx="20" cy="15" r="6"/>
  <circle class="doty" cx="40" cy="15" r="6"/>
  <circle class="dotg" cx="60" cy="15" r="6"/>
  <text class="ttl" x="410" y="19" text-anchor="middle">governor — boot→RUN on QEMU · operator e-stop→SAFE_STOP on Renode STM32 (virtual time)</text>

  <g transform="translate(18,56)">
    <text class="l a1"  y="0"><tspan class="prompt">$ </tspan><tspan class="cmd">west build -b qemu_cortex_m3 -t run .</tspan></text>
    <text class="l a2"  y="24"><tspan class="dim">*** Booting Zephyr OS build 36940db938a8 ***</tspan></text>
    <text class="l a3"  y="48"><tspan class="info">I: </tspan><tspan class="dim">governor boot: node online</tspan></text>
    <text class="l a4"  y="72"><tspan class="info">I: </tspan><tspan class="cmd">state=RUN setpoint=50</tspan></text>
    <text class="l a5"  y="96"><tspan class="info">I: </tspan>GOV state=<tspan class="ok">RUN</tspan> faults=0x0 meas=0  out=0</text>
    <text class="l a6"  y="120"><tspan class="info">I: </tspan>GOV state=<tspan class="ok">RUN</tspan> faults=0x0 meas=49 out=50   <tspan class="dim">← PID tracks setpoint</tspan></text>
    <text class="l a7"  y="144"><tspan class="info">I: </tspan>GOV state=<tspan class="ok">RUN</tspan> faults=0x0 meas=49 out=50</text>
    <text class="l a8"  y="168"><tspan class="info">I: </tspan>GOV state=<tspan class="ok">RUN</tspan> faults=0x0 meas=49 out=50</text>

    <text class="l a9"  y="200"><tspan class="dim"># Renode STM32 (F13): operator e-stop — 9-byte CMD frame → link UART</tspan></text>
    <text class="l a10" y="224"><tspan class="prompt">&gt; </tspan><tspan class="cmd">7E 01 04 00 00 01 E5 5C 0C</tspan></text>
    <text class="l a11" y="252"><tspan class="info">I: </tspan>GOV state=<tspan class="crit">SAFE_STOP</tspan> faults=<tspan class="crit">0x200</tspan> meas=49 out=<tspan class="warn">0</tspan>  <tspan class="dim">← output driven safe</tspan></text>
    <text class="l a12" y="276"><tspan class="info">I: </tspan>GOV state=<tspan class="crit">SAFE_STOP</tspan> faults=<tspan class="crit">0x200</tspan> meas=49 out=0  <tspan class="dim">← latched (T8 / F13)</tspan></text>

    <text class="l a13" y="308"><tspan class="dim">   faults 0x200 = FAULT_OPERATOR_STOP · SAFE_STOP is latching until operator clear</tspan></text>
    <text class="l a14" y="336"><tspan class="ok">   ✓ every fault path lands in a defined safe state — flagged, never silent</tspan></text>
  </g>

  <text class="ttl" x="18" y="418" font-size="10.5">boot/RUN lines: docs/DEMO.md §1 (QEMU). e-stop→SAFE_STOP: renode/system_faults.robot F13 asserts state=SAFE_STOP; the full status line is the node's real format (faults=0x200). Virtual time.</text>
  <rect class="caret" x="26" y="392" width="8" height="15"/>
</svg>
