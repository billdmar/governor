<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <!-- title block -->
  <text x="80" y="150" font-size="86" font-weight="800" fill="#e6edf3" letter-spacing="-1">governor</text>
  <text x="80" y="205" font-size="30" font-weight="600" fill="#b6a6ff">Production-style Zephyr RTOS firmware, verified like safety-critical software</text>
  <text x="80" y="248" font-size="22" fill="#8b949e">Telemetry &amp; control node · CRC-framed reliable link · PID loop · explicit safety state machine</text>

  <!-- stat cards -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="80" y="300" width="270" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="352" font-size="46" font-weight="800" fill="#3fb950">16/16</text>
    <text x="100" y="384" font-size="19" fill="#e6edf3">fault-matrix scenarios</text>
    <text x="100" y="408" font-size="15" fill="#8b949e">required safe-state outcomes</text>

    <!-- card 2 -->
    <rect x="370" y="300" width="270" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="390" y="352" font-size="46" font-weight="800" fill="#8b73ff">178.8M</text>
    <text x="390" y="384" font-size="19" fill="#e6edf3">libFuzzer + ASan runs</text>
    <text x="390" y="408" font-size="15" fill="#8b949e">zero findings</text>

    <!-- card 3 -->
    <rect x="660" y="300" width="270" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="680" y="352" font-size="46" font-weight="800" fill="#3fb950">98.16%</text>
    <text x="680" y="384" font-size="19" fill="#e6edf3">line coverage</text>
    <text x="680" y="408" font-size="15" fill="#8b949e">host-portable modules</text>

    <!-- card 4 -->
    <rect x="950" y="300" width="250" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="970" y="352" font-size="46" font-weight="800" fill="#8b73ff">0</text>
    <text x="970" y="384" font-size="19" fill="#e6edf3">post-init allocations</text>
    <text x="970" y="408" font-size="15" fill="#8b949e">-Werror · tidy · cppcheck clean</text>
  </g>

  <!-- footer tags -->
  <g font-size="19" fill="#8b949e">
    <text x="80" y="500">CI on simulated hardware — QEMU Cortex-M3 + Renode STM32F103</text>
    <text x="80" y="534" font-style="italic" fill="#6e7681">All timing / stack figures measured in virtual time and labeled as such — not silicon performance.</text>
  </g>

  <!-- chips -->
  <g font-size="16" font-weight="600">
    <rect x="80" y="560" width="130" height="40" rx="20" fill="#1c1b2e" stroke="#8b73ff" stroke-width="1.2"/>
    <text x="145" y="586" text-anchor="middle" fill="#b6a6ff">Zephyr RTOS</text>
    <rect x="222" y="560" width="150" height="40" rx="20" fill="#1c1b2e" stroke="#8b73ff" stroke-width="1.2"/>
    <text x="297" y="586" text-anchor="middle" fill="#b6a6ff">fault injection</text>
    <rect x="384" y="560" width="110" height="40" rx="20" fill="#1c1b2e" stroke="#8b73ff" stroke-width="1.2"/>
    <text x="439" y="586" text-anchor="middle" fill="#b6a6ff">fuzzing</text>
    <rect x="506" y="560" width="180" height="40" rx="20" fill="#1c1b2e" stroke="#8b73ff" stroke-width="1.2"/>
    <text x="596" y="586" text-anchor="middle" fill="#b6a6ff">safety state machine</text>
  </g>

  <text x="1200" y="590" text-anchor="end" font-size="20" font-weight="600" fill="#6e7681">github.com/billdmar/governor</text>
</svg>
