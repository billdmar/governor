name: ci

# governor CI — mirrors the proven local build sequence (docs/ENV.md) on a plain
# ubuntu runner, where Zephyr's native_sim/POSIX arch is supported (it is
# Linux-only). native_sim builds with the host gcc (no SDK); qemu_cortex_m3 uses
# the pinned arm-zephyr-eabi toolchain from the Zephyr SDK. Grows the
# Renode-matrix job in . Versions pinned to match local.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repo (no writes, no packages, no id-token).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZEPHYR_SDK_VERSION: "0.16.8"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps (pinned west + CMake 3.31 for Zephyr 3.7)
        run: |
          sudo apt-get update
          # gcc-multilib: native_sim builds 32-bit (-m32) and needs 32-bit glibc headers.
          sudo apt-get install -y ninja-build device-tree-compiler gperf ccache gcc-multilib g++-multilib
          # setuptools<81 keeps pkg_resources, which Zephyr 3.7 twister imports.
          pip install "west==1.5.0" "cmake==3.31.6" pyelftools "setuptools<81"

      - name: West init + update (pinned Zephyr v3.7.0, shallow)
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          west zephyr-export
          # `west init -l .` roots the topdir at the repo's parent, so resolve
          # Zephyr's real path rather than assuming a relative location.
          ZBASE="$(west list -f '{abspath}' zephyr)"
          echo "ZEPHYR_BASE=${ZBASE}" >> "$GITHUB_ENV"
          # Full Zephyr requirements: pulls all twister/build deps (natsort, ply,
          # anytree, etc.) rather than chasing them one by one.
          pip install -r "${ZBASE}/scripts/requirements.txt"

      - name: Install Zephyr SDK (arm-zephyr-eabi only)
        run: |
          cd /tmp
          BASE="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}"
          curl -fL --retry 3 -o sdk.tar.xz "${BASE}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar xf sdk.tar.xz
          curl -fL --retry 3 -o arm.tar.xz "${BASE}/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz"
          tar xf arm.tar.xz -C zephyr-sdk-${ZEPHYR_SDK_VERSION}
          cd zephyr-sdk-${ZEPHYR_SDK_VERSION}
          cmake -P ./cmake/zephyr_sdk_export.cmake
          echo "ZEPHYR_SDK_INSTALL_DIR=/tmp/zephyr-sdk-${ZEPHYR_SDK_VERSION}" >> "$GITHUB_ENV"

      - name: Smoke build — native_sim (host toolchain) + qemu_cortex_m3 (ARM SDK)
        run: |
          west build -b native_sim -p always . -d build_ns
          ZEPHYR_TOOLCHAIN_VARIANT=zephyr west build -b qemu_cortex_m3 -p always . -d build_qemu

      - name: Twister — tests on native_sim + qemu_cortex_m3 (with coverage)
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        run: |
          if find tests -name testcase.yaml 2>/dev/null | grep -q .; then
            # ztest suite runs on native_sim in CI (deterministic, gives the
            # coverage number). qemu_cortex_m3 runs the same suite LOCALLY (it
            # passes in ~15s) and is smoke-built in CI above; on the shared CI
            # runner qemu_cortex_m3 + twister hangs past a 120s harness timeout
            # (a known GH-runner flakiness), so it is not gated in CI. The
            # emulated-STM32 on-target proof is the Renode job. gcovr supports
            # txt/html/xml (not 'lcov').
            west twister -p native_sim -T tests/ \
              --inline-logs -v --coverage --coverage-formats txt
            echo "== coverage ==" && tail -30 twister-out/coverage/coverage.txt || true
          else
            echo "tests/ populated during  — smoke build above is the  gate"
          fi

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit + property tests (all portable modules, -Werror + ASan/UBSan)
        run: |
          for m in proto control telem drivers safety config integration; do
            echo "== tests/$m =="
            make -C "tests/$m" CC=cc test
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python ground-station tests
        run: |
          pip install pytest
          python -m pytest host/tests -q

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: cppcheck (host-portable libs + drivers)
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=1 --inline-suppr --std=c11 \
            -I lib/common -I lib/proto -I lib/control -I lib/telem -I lib/safety -I drivers \
            lib/ drivers/

  host-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz gate (frame decoder, 60s, libFuzzer+ASan+UBSan)
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined \
            -I lib/proto -I lib/common fuzz/fuzz_frame.c \
            lib/proto/frame.c lib/proto/crc16.c -o /tmp/fuzz_frame
          /tmp/fuzz_frame -max_total_time=60 fuzz/corpus
