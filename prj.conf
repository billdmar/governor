# governor — baseline Kconfig. Static-discipline defaults live here so every
# build inherits them; per-target overrides go in boards/ or twister.yaml.

# --- Logging (telemetry uses its own encoding; this is dev/boot logging) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- Static-memory discipline (the design notes: no dynamic allocation after init) ---
# No kernel heap pool: catches accidental k_malloc use at build/link time.
CONFIG_HEAP_MEM_POOL_SIZE=0
# Poison unused stack + enable the analyzer so stack high-water is measurable
# (docs/TASKS.md §3, config/registry.md §4). THREAD_ANALYZER requires stack-info
# + thread-monitor to walk each thread's poisoned region.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
# Periodic auto-dump so per-thread stack high-water is observable in a plain run
# / CI (config/registry.md §4 stack-margin evidence). 5 s = analyzer minimum.
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

# --- Scheduling resolution ---
# 1 kHz kernel tick = 1 ms resolution, so the 100 Hz (10 ms) control period is
# exactly 10 ticks. At the default 100 Hz tick (10 ms) a 10 ms sleep plus loop
# work rounds up to 2 ticks (20 ms), violating the registry §3 period bound.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# --- Fault visibility: never fail silent ---
CONFIG_ASSERT=y
