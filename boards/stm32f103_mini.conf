# stm32f103_mini — emulated-hardware target (Renode stm32f103.repl).
# Enables the real peripherals the fault matrix needs that qemu_cortex_m3
# (TI LM3S6965) lacks: I2C (F04/F05), an independent watchdog (F10), and an
# interrupt-driven link UART. Applied on top of prj.conf for this board only.

# --- Sensor bus (F04 I2C NAK / F05 bus error) ---
CONFIG_I2C=y

# --- Link UART (interrupt-driven RX for the framed protocol) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- Independent watchdog (F10 watchdog trip) ---
CONFIG_WATCHDOG=y

# --- Reset-cause readback for the watchdog sticky bit (SAFETY_SM T11) ---
CONFIG_HWINFO=y

# --- Config persistence across resets (: F15) via settings/NVS on flash ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Floating point (PID uses float; Cortex-M3 has no FPU → soft-float lib) ---
CONFIG_FPU=n

# --- Console logging stays on usart1 (board default zephyr,console). ---
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
